name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "Warning: GOOGLE_SERVICES_JSON is missing. Writing CI placeholder file."
            cat <<'EOF' > app/google-services.json
            {
              "project_info": {
                "project_number": "000000000000",
                "project_id": "ci-placeholder",
                "storage_bucket": "ci-placeholder.appspot.com"
              },
              "client": [
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:000000000000:android:placeholder",
                    "android_client_info": {
                      "package_name": "com.shihab.studyabroad"
                    }
                  },
                  "api_key": [
                    {
                      "current_key": "DUMMY_KEY"
                    }
                  ]
                },
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:000000000000:android:placeholderdebug",
                    "android_client_info": {
                      "package_name": "com.shihab.studyabroad.debug"
                    }
                  },
                  "api_key": [
                    {
                      "current_key": "DUMMY_KEY"
                    }
                  ]
                }
              ],
              "configuration_version": "1"
            }
            EOF
            exit 0
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Lint, Spotless Check, Unit Tests, and Build Assemblies
        run: ./gradlew lint spotlessCheck testDebugUnitTest assembleDebug assembleRelease

      - name: Upload Test Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
